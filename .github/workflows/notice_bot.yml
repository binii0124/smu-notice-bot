name: SMU Notice Bot  # 워크플로우 이름

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 실행 (UTC 기준)
  workflow_dispatch:      # GitHub 웹사이트에서 버튼 눌러서 수동 실행 가능하게 함

jobs:
  check-notice:
    runs-on: ubuntu-latest  # 리눅스 환경에서 실행
    
    # 리포지토리 쓰기 권한 설정 (last_id.txt를 업데이트하기 위해 필요)
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 현재 리포지토리의 코드를 가져옴

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run bot script
        env:
          # GitHub Secrets에 저장한 웹훅 URL을 환경 변수로 전달
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot.py

      - name: Commit and Push changes
        run: |
          # 파일이 변경되었을 때만(새 공지가 있을 때만) GitHub에 다시 커밋하여 저장
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_id.txt
          git commit -m "Update last_id.txt with latest notice" || echo "No changes to commit"
          git push